# Timer Plugin Configuration
# Those settings here can be changed either manually here or via commands
# (command changes are persisted to data.yml)

timer:
  # Default values used at startup. Runtime values (including changes made
  # via commands) are persisted in data.yml and override these when present.
  # Current timer value in seconds
  current-time: 0

  # Counting direction: true = count up, false = count down
  counting-up: true

  # Show timer in actionbar display
  show-actionbar: true

  # Maximum timer value in seconds (0 = no max time set)
  max-time: 0

  # Whether to show the max time in the actionbar display
  # Format: "current-time / max-time" (e.g., "00:01:30 / 00:05:00")
  show-max-time: false

  # Animation settings for the action bar display
  animation:
    # Animation type: gradient, wave, pulse, rainbow, still
    # - gradient: Smooth color transition from color1 to color2
    # - wave: Wave effect moving across the text
    # - pulse: Pulsing color effect
    # - rainbow: Animated rainbow colors
    # - still: Static single color (uses color1)
    type: gradient

    # Primary color (hex format, e.g., #00FF00 for green)
    color1: "#00FF00"

    # Secondary color (hex format, e.g., #0080FF for blue)
    color2: "#0080FF"

    # Color animation speed multiplier
    # Controls how fast wave, pulse, and rainbow animations move
    # Default: 1.0 (normal speed)
    # Range: 0.1 (very slow) to 10.0 (very fast)
    # Examples: 0.5 = half speed, 2.0 = double speed
    speed: 1.0

    # Time set animation duration in ticks (20 ticks = 1 second)
    # Controls how smooth the transition is when setting a new time
    # Default: 10 ticks (0.5 seconds)
    # Range: 1-100 ticks
    duration-ticks: 10

  # Timer targets - execute commands at specific times
  # Multiple targets can be configured
  # Each target has an ID, time (in seconds), and optional command
  targets:
  # Example target configurations (commented out by default):
  # warning1:
  #   time: 300
  #   command: say 5 minutes remaining!
  # warning2:
  #   time: 60
  #   command: say 1 minute remaining!
  # end:
  #   time: 0
  #   command: say Time's up!

  # Max time target - execute command when max time is reached
  max-target-command: null

# Configure world reset behavior
# NOTE: /reset restarts the server. Worlds are deleted during the next startup
# (before they are loaded) and regenerated with the configured/new seed.
reset:
  # Disallow specifying a custom seed via /reset <seed>
  # When true, /reset always uses a random seed
  # Default: true (for safety)
  disallow-custom-seed: true

  # Hide the seed that is being used from the /reset broadcast
  # Default: true
  hide-seed: true

  # List every world folder that should be deleted when /reset runs
  # Default covers the vanilla trio; add custom worlds here if needed
  #
  # Wildcard patterns are supported:
  #   "*" - deletes all worlds
  #   "world*" - deletes worlds starting with "world" (e.g., world, world_nether, world_the_end)
  #   "*nether" - deletes worlds ending with "nether"
  #   "*custom*" - deletes worlds containing "custom"
  #   "lobby_*" - deletes worlds starting with "lobby_"
  worlds-to-delete:
    - world
    - world_nether
    - world_the_end

  # Delete worlds on server boot (before world loading)
  # WARNING: This will delete the specified worlds every time the server starts!
  # Default: false (disabled for safety)
  delete-on-boot: false

  # Reset the world instantly when a player dies
  # Default: false (disabled)
  reset-on-player-death: false